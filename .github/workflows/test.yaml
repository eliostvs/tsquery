name: Test

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'
          cache: true

      - name: test
        run: |
          task test
