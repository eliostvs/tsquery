name: Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.21'
          cache: true

      - name: install task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: test
        run: |
          task test
